services:
  bot:
    container_name: binance-futures-short-bot
    image: binance-futures-short-bot:${DEPLOY_IMAGE_TAG:-latest}
    build:
      context: .
    env_file:
      - .env
    environment:
      STATE_FILE: /app/data/signals_state.json
    user: "1000:1000"
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:${PORT:-8080}/health', timeout=5)
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 10m
